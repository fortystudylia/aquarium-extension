<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Lớp render đồ họa WebGL -->
    <canvas id="aquarium-canvas"></canvas>

    <!-- Lớp giao diện người dùng -->
    <div id="ui-layer">
        <form id="search-form" class="search-container">
            <input type="search" id="search-input" placeholder="Tìm kiếm trên web..." autofocus>
        </form>
        
        <div class="shortcuts-container" id="shortcuts">
            <!-- Nơi render các nút shortcut trong tương lai -->
        </div>
        
        <button id="settings-btn" title="Cài đặt">⚙️</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
